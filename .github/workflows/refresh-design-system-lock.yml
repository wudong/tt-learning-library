name: Refresh design system lockfile

on:
  push:
    branches:
      - feat/adopt-tt-players-design-system
    paths:
      - apps/web/package.json
      - .npmrc
      - .github/workflows/refresh-design-system-lock.yml

permissions:
  contents: write
  packages: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/adopt-tt-players-design-system

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh Bun lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install

      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Bun lockfile for design system 0.1.2"
          git push origin HEAD:feat/adopt-tt-players-design-system
