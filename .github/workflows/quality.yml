name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ttlearn
          POSTGRES_PASSWORD: ttlearn_test
          POSTGRES_DB: tt_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttlearn -d tt_learning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ttlearn:ttlearn_test@localhost:5432/tt_learning?sslmode=disable
      TEST_DATABASE_URL: postgres://ttlearn:ttlearn_test@localhost:5432/tt_learning?sslmode=disable
      TEST_SCHEMA: tt_test
      HOSTED_AUTH_REQUIRED: "false"
      WEB_ORIGIN: http://localhost:5174
      PUBLIC_APP_ORIGIN: http://localhost:5174

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test public sharing
        run: bun test tests/integration/share.test.ts

      - name: Test concurrent migrations
        run: bun test tests/migrationConcurrency.test.ts

      - name: Test full suite
        run: |
          set -o pipefail
          bun test 2>&1 | tee full-test-output.log

      - name: Upload full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-output
          path: full-test-output.log
          if-no-files-found: ignore

      - name: Migrate database
        run: bun run db:migrate

      - name: Build
        run: bun run build

      - name: Capture mobile UI screenshots
        run: |
          set -euo pipefail
          bun run db:seed
          bun run dev > mobile-audit-server.log 2>&1 &
          DEV_PID=$!
          cleanup() {
            kill "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5174/ >/dev/null && curl -fsS http://localhost:3003/api/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              cat mobile-audit-server.log
              exit 1
            fi
            sleep 1
          done

          OVERVIEW=$(curl -fsS http://localhost:3003/api/library/overview)
          TOPIC_ID=$(printf '%s' "$OVERVIEW" | jq -r '.data.topics[] | select(.name == "Backhand") | .nodeId' | head -1)
          SKILL_ID=$(printf '%s' "$OVERVIEW" | jq -r '.data.skills[] | select(.name == "Backhand Chop") | .nodeId' | head -1)
          SKILL_ROW_ID=$(printf '%s' "$OVERVIEW" | jq -r '.data.skills[] | select(.name == "Backhand Chop") | .id' | head -1)
          DRILL_ID=$(printf '%s' "$OVERVIEW" | jq -r '.data.drills[] | select(.title == "Backhand Chop Depth Control") | .nodeId' | head -1)
          test -n "$TOPIC_ID"
          test -n "$SKILL_ID"
          test -n "$SKILL_ROW_ID"
          test -n "$DRILL_ID"

          VIDEO_RESPONSE=$(curl -fsS -X POST http://localhost:3003/api/videos \
            -H 'content-type: application/json' \
            --data "{\"sourceUrl\":\"https://youtu.be/mobile-audit-backhand-chop\",\"title\":\"Backhand chop technique review\",\"topicIds\":[],\"skillIds\":[\"${SKILL_ROW_ID}\"],\"tagIds\":[],\"progress\":\"watched\",\"learningState\":\"practicing\"}")
          VIDEO_ID=$(printf '%s' "$VIDEO_RESPONSE" | jq -r '.data.video.id // empty')
          test -n "$VIDEO_ID"

          TODAY=$(date +%F)
          TRAINING_RESPONSE=$(curl -fsS -X POST http://localhost:3003/api/training/sessions \
            -H 'content-type: application/json' \
            --data "{\"scheduledDate\":\"${TODAY}\",\"timeZone\":\"Europe/London\",\"title\":\"Backhand chop focus\",\"entryMode\":\"planned\",\"blocks\":[{\"skillId\":\"${SKILL_ROW_ID}\",\"plannedDurationSeconds\":600}]}")
          SESSION_ID=$(printf '%s' "$TRAINING_RESPONSE" | jq -r '.data.session.id // empty')
          test -n "$SESSION_ID"

          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          mkdir -p mobile-ui-screenshots

          capture() {
            width=$1
            height=$2
            name=$3
            route=$4
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-gpu \
              --hide-scrollbars \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=5000 \
              --window-size="${width},${height}" \
              --screenshot="mobile-ui-screenshots/${name}.png" \
              "http://localhost:5174${route}"
          }

          capture_routes() {
            width=$1
            height=$2
            suffix=$3
            capture "$width" "$height" "home-${suffix}" /
            capture "$width" "$height" "inbox-${suffix}" /inbox
            capture "$width" "$height" "library-${suffix}" /library
            capture "$width" "$height" "topic-detail-${suffix}" "/library/topics/${TOPIC_ID}"
            capture "$width" "$height" "topic-pictures-${suffix}" "/library/topics/${TOPIC_ID}/pictures"
            capture "$width" "$height" "skill-detail-${suffix}" "/library/skills/${SKILL_ID}"
            capture "$width" "$height" "drill-detail-${suffix}" "/library/drills/${DRILL_ID}"
            capture "$width" "$height" "connections-${suffix}" "/library/connections/${SKILL_ID}"
            capture "$width" "$height" "video-detail-${suffix}" "/videos/${VIDEO_ID}"
            capture "$width" "$height" "add-video-${suffix}" /videos/new
            capture "$width" "$height" "training-${suffix}" /training
            capture "$width" "$height" "plan-training-${suffix}" "/training/new?date=${TODAY}&mode=planned"
            capture "$width" "$height" "log-training-${suffix}" "/training/new?date=${TODAY}&mode=manual"
            capture "$width" "$height" "training-detail-${suffix}" "/training/${SESSION_ID}"
            capture "$width" "$height" "training-live-${suffix}" "/training/${SESSION_ID}/run"
            capture "$width" "$height" "search-${suffix}" "/search?q=backhand"
            capture "$width" "$height" "settings-${suffix}" /settings
          }

          capture_routes 384 900 384
          capture_routes 320 800 320

      - name: Upload mobile UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-screenshots
          path: |
            mobile-ui-screenshots
            mobile-audit-server.log
          if-no-files-found: warn

      - name: Verify PWA
        run: bun run test:pwa
