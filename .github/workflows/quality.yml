name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ttlearn
          POSTGRES_PASSWORD: ttlearn_test
          POSTGRES_DB: tt_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttlearn -d tt_learning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://ttlearn:ttlearn_test@localhost:5432/tt_learning?sslmode=disable
      TEST_DATABASE_URL: postgres://ttlearn:ttlearn_test@localhost:5432/tt_learning?sslmode=disable
      TEST_SCHEMA: tt_test
      HOSTED_AUTH_REQUIRED: "false"
      WEB_ORIGIN: http://localhost:5174
      PUBLIC_APP_ORIGIN: http://localhost:5174

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test public sharing
        run: bun test tests/integration/share.test.ts

      - name: Test concurrent migrations
        run: bun test tests/migrationConcurrency.test.ts

      - name: Test full suite
        run: |
          set -o pipefail
          bun test 2>&1 | tee full-test-output.log

      - name: Upload full test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-output
          path: full-test-output.log
          if-no-files-found: ignore

      - name: Migrate database
        run: bun run db:migrate

      - name: Build
        run: bun run build

      - name: Capture mobile UI screenshots
        run: |
          set -euo pipefail
          bun run db:seed
          bun run dev > mobile-audit-server.log 2>&1 &
          DEV_PID=$!
          cleanup() {
            kill "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5174/ >/dev/null && curl -fsS http://localhost:3003/api/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              cat mobile-audit-server.log
              exit 1
            fi
            sleep 1
          done

          OVERVIEW=$(curl -fsS http://localhost:3003/api/library/overview)
          TOPIC_ID=$(printf '%s' "$OVERVIEW" | jq -r '.data.topics[0].nodeId // empty')
          SKILL_ID=$(printf '%s' "$OVERVIEW" | jq -r '.data.skills[0].nodeId // empty')
          DRILL_ID=$(printf '%s' "$OVERVIEW" | jq -r '.data.drills[0].nodeId // empty')
          test -n "$TOPIC_ID"
          test -n "$SKILL_ID"
          test -n "$DRILL_ID"

          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          mkdir -p mobile-ui-screenshots
          TODAY=$(date +%F)

          capture() {
            width=$1
            height=$2
            name=$3
            route=$4
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-gpu \
              --hide-scrollbars \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=5000 \
              --window-size="${width},${height}" \
              --screenshot="mobile-ui-screenshots/${name}.png" \
              "http://localhost:5174${route}"
          }

          capture 384 900 library-384 /library
          capture 384 900 topic-detail-384 "/library/topics/${TOPIC_ID}"
          capture 384 900 topic-pictures-384 "/library/topics/${TOPIC_ID}/pictures"
          capture 384 900 drill-detail-384 "/library/drills/${DRILL_ID}"
          capture 384 900 inbox-384 /inbox
          capture 384 900 training-384 /training
          capture 384 900 plan-training-384 "/training/new?date=${TODAY}&mode=planned"
          capture 320 800 library-320 /library
          capture 320 800 topic-pictures-320 "/library/topics/${TOPIC_ID}/pictures"
          capture 320 800 skill-detail-320 "/library/skills/${SKILL_ID}"
          capture 320 800 training-320 /training
          capture 320 800 plan-training-320 "/training/new?date=${TODAY}&mode=planned"

      - name: Upload mobile UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-screenshots
          path: |
            mobile-ui-screenshots
            mobile-audit-server.log
          if-no-files-found: warn

      - name: Verify PWA
        run: bun run test:pwa
