name: Publish Simulator Demo

on:
  push:
    branches:
      - main
    paths:
      - apps/web/public/simulator/**
      - .github/workflows/simulator-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: simulator-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload simulator site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/public/simulator

      - name: Deploy simulator site
        id: deployment
        uses: actions/deploy-pages@v4
